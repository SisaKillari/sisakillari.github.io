<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisa Killari</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:url('fondo.png') center/cover fixed no-repeat}
.overlay{background:rgba(245,242,235,.45);min-height:100vh}
.logo{display:block;width:100vw;max-width:100vw;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:0 10px 30px;max-width:700px;margin:auto}
.card{position:relative;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.7)}
.card img{width:100%;display:block}
.infoBtn,.addBtn{
position:absolute;bottom:10px;width:42px;height:42px;border:none;border-radius:50%;
color:#fff;font-size:22px
}
.infoBtn{left:10px;background:#4c6f8f}
.addBtn{right:10px;background:#6d9865}
.cartbtn{position:fixed;top:12px;right:12px;width:54px;height:54px;border-radius:50%;background:#6d9865;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;z-index:1000}
.badge{position:absolute;top:-3px;right:-3px;background:#d33;border-radius:50%;padding:2px 6px;font-size:11px;color:#fff}
.wa{position:fixed;bottom:14px;right:14px;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center}
.sidebar,.infoPanel{position:fixed;top:0;right:-340px;width:320px;height:100%;background:#fff;padding:18px;overflow:auto;transition:.3s;z-index:1100}
.open{right:0}
.row{display:flex;justify-content:space-between;margin:8px 0}
select{width:100%;padding:8px;margin:8px 0}
.btn{display:block;text-align:center;background:#6d9865;color:#fff;text-decoration:none;padding:12px;border-radius:10px;margin-top:12px}
.close{float:right;border:none;padding:6px 10px}
</style>
</head>
<body>
<div class="overlay">
<img src="logo.png" class="logo">

<div class="grid">
<div class="card"><img src="producto1.png"><button class="infoBtn" onclick="showInfo('Crema Curativa','Elaborada con ingredientes naturales para acompañar el cuidado diario de la piel.')">ℹ</button><button class="addBtn" onclick="add('Crema Curativa')">+</button></div>
<div class="card"><img src="producto2.png"><button class="infoBtn" onclick="showInfo('Repelente Natural','Fórmula vegetal para ayudar a mantener alejados los insectos.')">ℹ</button><button class="addBtn" onclick="add('Repelente Natural')">+</button></div>
<div class="card"><img src="producto3.png"><button class="infoBtn" onclick="showInfo('Agua Florida','Preparación aromática inspirada en tradiciones ancestrales.')">ℹ</button><button class="addBtn" onclick="add('Agua Florida')">+</button></div>
<div class="card"><img src="producto4.png"><button class="infoBtn" onclick="showInfo('Desodorante Natural','Alternativa natural para el cuidado cotidiano.')">ℹ</button><button class="addBtn" onclick="add('Desodorante Natural')">+</button></div>
</div>
</div>

<a href="#" class="cartbtn" onclick="toggleCart();return false;">🛒<span id="count" class="badge">0</span></a>
<a href="https://wa.me/5492215980355" class="wa">💬</a>

<div id="cart" class="sidebar">
<h2>Tu Pedido</h2>
<div id="items"></div>

<label>Provincia</label>
<select id="provincia" onchange="provinciaChanged()">
<option>CABA</option><option>Buenos Aires</option><option>Catamarca</option><option>Chaco</option><option>Chubut</option><option>Córdoba</option><option>Corrientes</option><option>Entre Ríos</option><option>Formosa</option><option>Jujuy</option><option>La Pampa</option><option>La Rioja</option><option>Mendoza</option><option>Misiones</option><option>Neuquén</option><option>Río Negro</option><option>Salta</option><option>San Juan</option><option>San Luis</option><option>Santa Cruz</option><option>Santa Fe</option><option>Santiago del Estero</option><option>Tierra del Fuego</option><option>Tucumán</option>
</select>

<div id="locWrap" style="display:none">
<label>Localidad</label>
<select id="localidad" onchange="render()">
<option>Avellaneda</option><option>Bahía Blanca</option><option>Banfield</option><option>Berazategui</option><option>Berisso</option><option>Campana</option><option>Castelar</option><option>Chivilcoy</option><option>City Bell</option><option>Ensenada</option><option>Escobar</option><option>Ezpeleta</option><option>Florida</option><option>General Rodríguez</option><option>Gonnet</option><option>Haedo</option><option>Ituzaingó</option><option>José C. Paz</option><option>Junín</option><option>La Plata</option><option>Lanús</option><option>Lomas de Zamora</option><option>Luján</option><option>Malvinas Argentinas</option><option>Mar del Plata</option><option>Martínez</option><option>Merlo</option><option>Moreno</option><option>Morón</option><option>Necochea</option><option>Olavarría</option><option>Olivos</option><option>Pergamino</option><option>Pilar</option><option>Quilmes</option><option>Ramos Mejía</option><option>Ringuelet</option><option>San Fernando</option><option>San Isidro</option><option>San Miguel</option><option>Tandil</option><option>Temperley</option><option>Tigre</option><option>Tolosa</option><option>Vicente López</option><option>Villa Elisa</option><option>Zárate</option>
</select>
</div>

<a id="pedido" class="btn" target="_blank">Hacer Pedido</a>
</div>

<div id="info" class="infoPanel">
<button class="close" onclick="closeInfo()">✕</button>
<h2 id="infoTitle"></h2><br>
<p id="infoText"></p>
</div>

<script>
let cart={};
function add(n){cart[n]=(cart[n]||0)+1;render();}
function change(n,v){cart[n]+=v;if(cart[n]<=0) delete cart[n];render();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function provinciaChanged(){
 document.getElementById('locWrap').style.display =
 document.getElementById('provincia').value==='Buenos Aires'?'block':'none';
 render();
}
function render(){
document.getElementById('count').innerText=Object.values(cart).reduce((a,b)=>a+b,0);
let h='';
for(let k in cart){h+=`<div class="row">${k}<span><button onclick="change('${k}',-1)">-</button> ${cart[k]} <button onclick="change('${k}',1)">+</button></span></div>`;}
document.getElementById('items').innerHTML=h;
let txt='Hola 🌿%0A%0AQuiero estos productos:%0A';
for(let k in cart){txt+='• '+k+' x'+cart[k]+'%0A';}
txt+='%0ATe escribo desde:%0AProvincia: '+provincia.value;
if(provincia.value==='Buenos Aires') txt+='%0ALocalidad: '+localidad.value;
pedido.href='https://wa.me/5492215980355?text='+txt;
}
function showInfo(t,d){infoTitle.innerText=t;infoText.innerText=d;info.classList.add('open');}
function closeInfo(){info.classList.remove('open');}
render();
</script>
</body>
</html>
