<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisa Killari</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,serif;background:linear-gradient(180deg,#6f8d69,#e9efe6,#d7e6d2);color:#31422f}
.hero{text-align:center;padding:25px 15px}
.logo{width:220px;border-radius:50%;box-shadow:0 8px 25px rgba(0,0,0,.2)}
.catalogo{width:92%;max-width:900px;display:block;margin:20px auto;border-radius:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;padding:20px;max-width:1100px;margin:auto}
.card{background:rgba(255,255,255,.75);border-radius:20px;overflow:hidden;position:relative}
.card img{width:100%;display:block}
.add{position:absolute;top:10px;right:10px;width:42px;height:42px;border:none;border-radius:50%;background:#4f8a4f;color:#fff;font-size:24px;cursor:pointer}
.flash{animation:flash .5s}
@keyframes flash{50%{box-shadow:0 0 30px #4cff7a}}
.esencia{max-width:900px;margin:20px auto;padding:25px;background:rgba(255,255,255,.7);border-radius:20px;line-height:1.8}
.float{position:fixed;bottom:20px;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;text-decoration:none}
.cart{left:20px;background:#567552}
.wa{right:20px;background:#25D366}
.sidebar{position:fixed;left:-320px;top:0;width:300px;height:100%;background:white;padding:20px;transition:.3s;overflow:auto;box-shadow:0 0 20px rgba(0,0,0,.2)}
.sidebar.open{left:0}
.pedido{display:block;margin-top:20px;padding:12px;text-align:center;background:#567552;color:white;text-decoration:none;border-radius:12px}
</style>
</head>
<body>

<section class="hero">
<img src="logo.png" class="logo" alt="Logo">
</section>

<img src="catalogo.png" class="catalogo" alt="Catalogo">

<div class="grid">
<div class="card"><button class="add" onclick="agregar('Crema Curativa',this)">+</button><img src="producto1.png"></div>
<div class="card"><button class="add" onclick="agregar('Repelente Natural',this)">+</button><img src="producto2.png"></div>
<div class="card"><button class="add" onclick="agregar('Agua Florida',this)">+</button><img src="producto3.png"></div>
<div class="card"><button class="add" onclick="agregar('Desodorante Natural',this)">+</button><img src="producto4.png"></div>
</div>

<div class="esencia">
<h2>Nuestra Esencia</h2><br>
En Sisa Killari elaboramos productos naturales inspirados en los saberes ancestrales, el poder de las plantas y el cuidado consciente del cuerpo.
</div>

<div class="sidebar" id="sidebar">
<h2>Tu Pedido</h2>
<ul id="lista"></ul>
<a id="pedidoLink" class="pedido" target="_blank">🌿 Hacer mi pedido</a>
</div>

<a href="#" class="float cart" onclick="toggleCart();return false;">🛒 <span id="cartCount">0</span></a>
<a href="https://wa.me/5492215980355" class="float wa">💬</a>

<script>
let carrito=[];
function agregar(nombre,btn){
 carrito.push(nombre);
 document.getElementById('cartCount').innerText=carrito.length;
 let li=document.createElement('li');
 li.textContent=nombre;
 document.getElementById('lista').appendChild(li);
 btn.parentElement.classList.add('flash');
 setTimeout(()=>btn.parentElement.classList.remove('flash'),500);
 actualizar();
}
function toggleCart(){
 document.getElementById('sidebar').classList.toggle('open');
}
function actualizar(){
 let txt='Hola Sisa Killari 🌿%0A%0AQuiero pedir:%0A';
 carrito.forEach(p=>txt+='• '+p+'%0A');
 document.getElementById('pedidoLink').href='https://wa.me/5492215980355?text='+txt;
}
</script>

</body>
</html>
