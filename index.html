<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisa Killari</title>

<style>
body{
margin:0;
font-family:Georgia,serif;
background:#f8f6f1;
color:#556555;
}
nav{
position:sticky;
top:0;
background:white;
padding:15px;
display:flex;
justify-content:center;
gap:25px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}
nav a{color:#556555;text-decoration:none;font-weight:bold;}
.hero{
text-align:center;
padding:40px 20px;
background:#eef3ee;
}
.hero img{max-width:260px;width:80%;}
h1{font-size:4rem;margin:15px 0;}
.btn{
display:inline-block;
background:#89a483;
color:white;
padding:15px 25px;
border-radius:15px;
text-decoration:none;
font-weight:bold;
}
.section{padding:50px 20px;max-width:1200px;margin:auto;}
.catalogo{width:100%;border-radius:20px;}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}
.card{
background:white;
padding:15px;
border-radius:20px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
text-align:center;
}
.card img{width:100%;border-radius:15px;}
.card button{
background:#89a483;
color:white;
border:none;
padding:12px;
border-radius:12px;
cursor:pointer;
width:100%;
}
#carrito{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px 18px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}
</style>
</head>
<body>

<nav>
<a href="#inicio">Inicio</a>
<a href="#productos">Productos</a>
<a href="#pedido">Pedido</a>
</nav>

<section class="hero" id="inicio">
<img src="logo.png" alt="Logo">
<h1>Sisa Killari</h1>
<p>Productos naturales elaborados artesanalmente</p>
<a class="btn" href="#productos">Ver Productos</a>
</section>

<section class="section">
<img src="catalogo-1.jpg" class="catalogo">
</section>

<section class="section" id="productos">
<h2>Nuestros Productos</h2>

<div class="grid">

<div class="card">
<img src="producto1.png">
<h3>Repelente Natural</h3>
<button onclick="agregar('Repelente Natural')">Agregar</button>
</div>

<div class="card">
<img src="producto2.png">
<h3>Agua Florida</h3>
<button onclick="agregar('Agua Florida')">Agregar</button>
</div>

<div class="card">
<img src="producto3.png">
<h3>Crema Curativa</h3>
<button onclick="agregar('Crema Curativa')">Agregar</button>
</div>

<div class="card">
<img src="producto4.png">
<h3>Desodorante Natural</h3>
<button onclick="agregar('Desodorante Natural')">Agregar</button>
</div>

</div>
</section>

<section class="section" id="pedido">
<h2>Mi Pedido</h2>
<div id="carrito">
<p>No hay productos agregados.</p>
</div>
<br>
<button class="btn" onclick="enviarWhatsapp()">Enviar pedido por WhatsApp</button>
</section>

<a class="whatsapp" href="https://wa.me/5492215980355" target="_blank">WhatsApp</a>

<script>
let carrito=[];

function agregar(producto){
carrito.push(producto);
mostrar();
}

function mostrar(){
let html="";
for(let item of carrito){
html+="• "+item+"<br>";
}
document.getElementById("carrito").innerHTML=html||"No hay productos agregados.";
}

function enviarWhatsapp(){
let mensaje="Hola Sisa Killari 🌿%0A%0AQuiero realizar el siguiente pedido:%0A";
for(let item of carrito){
mensaje+="• "+item+"%0A";
}
window.open("https://wa.me/5492215980355?text="+mensaje,"_blank");
}
</script>

</body>
</html>
