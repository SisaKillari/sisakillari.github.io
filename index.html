<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sisa Killari</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
background:url('fondo.png') center/cover fixed no-repeat;
font-family:Georgia,serif;
}
.overlay{
background:rgba(245,242,235,.55);
min-height:100vh;
padding:8px 10px 60px;
}
.logo{
display:block;
width:98vw;
max-width:520px;
margin:0 auto -10px auto;
}
.grid{
display:grid;
grid-template-columns:1fr;
gap:14px;
max-width:700px;
margin:auto;
}
.card{
position:relative;
background:rgba(255,255,255,.72);
backdrop-filter:blur(6px);
border-radius:24px;
overflow:hidden;
}
.card img{width:100%;display:block}
.add{
position:absolute;
top:10px;
right:10px;
width:48px;
height:48px;
border:none;
border-radius:50%;
background:#6b9662;
color:#fff;
font-size:28px;
}
.esencia{
max-width:800px;
margin:25px auto;
padding:20px;
background:rgba(255,255,255,.7);
border-radius:20px;
}
.esencia h2{
font-family:'Cormorant Garamond',serif;
font-size:42px;
margin-bottom:10px;
}
.floatcart{
position:fixed;
top:14px;
right:14px;
width:55px;
height:55px;
border-radius:50%;
background:#6b9662;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
font-size:24px;
z-index:999;
}
.badge{
position:absolute;
top:-3px;
right:-3px;
background:#d33;
color:#fff;
border-radius:50%;
padding:2px 6px;
font-size:11px;
}
.wa{
position:fixed;
right:14px;
bottom:14px;
width:55px;
height:55px;
border-radius:50%;
background:#25D366;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
font-size:24px;
}
.sidebar{
position:fixed;
right:-320px;
top:0;
width:300px;
height:100%;
background:#fff;
padding:20px;
transition:.3s;
overflow:auto;
}
.sidebar.open{right:0}
.row{
display:flex;
justify-content:space-between;
margin:10px 0;
}
.btn{
display:block;
margin-top:15px;
padding:12px;
background:#6b9662;
color:#fff;
text-decoration:none;
text-align:center;
border-radius:12px;
}
</style>
</head>
<body>
<div class="overlay">

<img src="logo.png" class="logo">

<div class="grid">
<div class="card"><button class="add" onclick="add('Crema Curativa')">+</button><img src="producto1.png"></div>
<div class="card"><button class="add" onclick="add('Repelente Natural')">+</button><img src="producto2.png"></div>
<div class="card"><button class="add" onclick="add('Agua Florida')">+</button><img src="producto3.png"></div>
<div class="card"><button class="add" onclick="add('Desodorante Natural')">+</button><img src="producto4.png"></div>
</div>

<div class="esencia">
<h2>Nuestra Esencia</h2>
<p>En Sisa Killari elaboramos productos naturales inspirados en saberes ancestrales y el poder de las plantas. Cada preparación es artesanal, creada para acompañar el bienestar, el equilibrio y el cuidado consciente del cuerpo.</p>
</div>

</div>

<a href="#" class="floatcart" onclick="toggleCart();return false;">🛒<span id="count" class="badge">0</span></a>
<a href="https://wa.me/5492215980355" class="wa">💬</a>

<div id="cart" class="sidebar">
<h2>Tu Pedido</h2>
<div id="items"></div>
<a id="send" class="btn" target="_blank">Hacer Pedido</a>
</div>

<script>
let cart={};
function add(n){cart[n]=(cart[n]||0)+1;render();}
function change(n,v){cart[n]+=v;if(cart[n]<=0)delete cart[n];render();}
function render(){
document.getElementById('count').innerText=Object.values(cart).reduce((a,b)=>a+b,0);
let h='';
for(let k in cart){
h+=`<div class="row">${k}<span><button onclick="change('${k}',-1)">-</button> ${cart[k]} <button onclick="change('${k}',1)">+</button></span></div>`;
}
document.getElementById('items').innerHTML=h;
let txt='Hola 🌿%0A%0AQuiero estos productos:%0A';
for(let k in cart){txt+='• '+k+' x'+cart[k]+'%0A';}
document.getElementById('send').href='https://wa.me/5492215980355?text='+txt;
}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
</script>
</body>
</html>
